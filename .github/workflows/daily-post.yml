name: Günlük paylaşım

on:
  schedule:
    # GitHub saatleri UTC'dir. 16:00 UTC = 19:00 Türkiye.
    # Günde iki paylaşım için ikinci bir satır ekleyin, örn: - cron: "0 7 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Deneme modu (Instagram'a gönderme)"
        type: boolean
        default: false
      format:
        description: "Paylaşım türü"
        type: choice
        options: [otomatik, image, reel]
        default: otomatik

permissions:
  contents: write   # gönderi kayıtlarını depoya yazmak için
  pages: write      # fotoğraf/videoyu GitHub Pages'te yayınlamak için
  id-token: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
      MEDIA_HOST: ${{ vars.MEDIA_HOST || 'pages' }}
      GEMINI_VIDEO_MODEL: ${{ vars.GEMINI_VIDEO_MODEL }}
      FORCE_FORMAT: ${{ inputs.format != 'otomatik' && inputs.format || '' }}
      GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
      GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
      DRY_RUN: ${{ inputs.dry_run == true && 'true' || vars.DRY_RUN || 'false' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Plan, fikir, görsel/video, kontrol ve açıklama üret
        run: python -m influencer_bot generate

      - name: Taslağı depoya kaydet
        id: save
        run: |
          git config user.name  "influencer-bot"
          git config user.email "influencer-bot@users.noreply.github.com"
          git add posts
          git commit -m "Yeni gönderi taslağı"
          git pull --rebase --quiet
          git push --quiet
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Medyayı GitHub Pages için paketle
        if: env.MEDIA_HOST == 'pages' && env.DRY_RUN != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pages'te yayınla
        if: env.MEDIA_HOST == 'pages' && env.DRY_RUN != 'true'
        uses: actions/deploy-pages@v4

      - name: Dosyanın internette yayına girmesini bekle
        if: env.MEDIA_HOST != 'imgbb' && env.DRY_RUN != 'true'
        env:
          PUBLIC_REF: ${{ steps.save.outputs.ref }}
        run: |
          URL=$(python -m influencer_bot media-url)
          echo "Bekleniyor: $URL"
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL")" = "200" ] && echo "Hazır." && exit 0
            sleep 10
          done
          echo "::error::Dosyaya 10 dakikada ulaşılamadı. Depo public mi ve Settings > Pages açık mı? README'ye bakın."
          exit 1

      - name: Instagram'a paylaş
        env:
          PUBLIC_REF: ${{ steps.save.outputs.ref }}
        run: python -m influencer_bot publish

      - name: Sonucu kaydet
        if: always() && steps.save.outcome == 'success'
        run: |
          git add posts
          git diff --cached --quiet || git commit -m "Paylaşım sonucu"
          git pull --rebase --quiet
          git push --quiet

      - name: Özet
        if: always()
        run: python -m influencer_bot summary >> "$GITHUB_STEP_SUMMARY"
