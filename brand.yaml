# ─────────────────────────────────────────────────────────────
#  Marka ayarları
#  Botu başka bir markaya/ürüne uyarlamak için bu dosyayı, cast/ ve
#  products/ klasörlerini değiştirmeniz yeterli. Koda dokunmayın.
# ─────────────────────────────────────────────────────────────

name: Maske Atölyesi            # Markanızın adı
handle: izmiraltsat35           # Instagram kullanıcı adı (bilgi amaçlı)
language: tr                    # Açıklama dili
timezone: Europe/Istanbul

# Ne satıyoruz, nasıl bir marka? Fikir ve açıklama ajanları bunu okur.
about: >-
  Kendi atölyemizde ürettiğimiz baskılı kar maskeleri (balaclava): kuru kafa, gülen dişler,
  alev, bandana, oni, kaplan, kurt ve komik bıyıklı yüzler. Siyah, esnek, tek göz açıklıklı.
  Kayakta, snowboardda, telesiyejde herkesin dönüp baktığı, arkadaş gruplarının
  birlikte takıp güldüğü maskeler. Sıcak tutar, nefes alır, tek beden.

# Açıklamaların ses tonu
voice: >-
  Esprili, enerjik, kısa. "POV:" ile başlayan ya da tek cümlelik komik bir
  durumla açılır. En fazla 3 emoji. Satış cümlesi tek satır ve en sonda.

# Her açıklamanın sonundaki satın alma çağrısı
call_to_action: "Sipariş için DM'den \"MASKE\" yazın 📩"

# ── Karakter kadrosu ──
# Her karakterin fotoğrafları cast/<id>/ klasöründe durur.
# appearance SABİTTİR: yüzlerin tutarlı kalması için sonradan değiştirmeyin.
cast:
  - id: lina
    name: Lina
    appearance: >-
      24-year-old woman, light olive skin, shoulder-length wavy dark brown hair,
      hazel eyes, subtle freckles, slim athletic build
    style: pastel lilac ski jacket, white ski pants
  - id: ahmet
    name: Ahmet
    appearance: >-
      28-year-old man, tanned skin, short black hair, short trimmed beard,
      brown eyes, broad shoulders, tall
    style: dark green ski jacket, black ski pants
  - id: mehmet
    name: Mehmet
    appearance: >-
      27-year-old man, fair skin, curly light brown hair, clean-shaven, round face,
      green eyes, average height, slightly stocky build
    style: burgundy puffer jacket, beige ski pants
  - id: zeynep
    name: Zeynep
    appearance: >-
      26-year-old woman, warm brown skin, long straight black hair in a low ponytail,
      dark brown eyes, petite build
    style: bright yellow ski jacket, navy ski pants

# ── Sahneler ──
# people: sahnede kaç kişi olsun [en az, en çok]
scenes:
  - { name: "telesiyejde arkadaş grubu selfie'si, arkada karlı dağlar", weight: 3, people: [2, 3] }
  - { name: "pistten hızla inerken GoPro tarzı selfie", weight: 3, people: [1, 1] }
  - { name: "pist başında maskeyi takarken önce/sonra anı", weight: 2, people: [1, 2] }
  - { name: "dağ kafesinde sıcak çikolata molası, maskeler yarı açık", weight: 1, people: [2, 3] }
  - { name: "teleferik kuyruğunda bekleyen komik grup", weight: 2, people: [3, 4] }
  - { name: "kar topu savaşı", weight: 1, people: [2, 4] }
  - { name: "zirvede asker selamı veren poz, arkada manzara", weight: 1, people: [1, 3] }

# ── Paylaşım türleri ── (göreceli ağırlık; 0 = kapalı)
formats:
  image: 1      # Fotoğraf gönderisi (ucuz, hızlı)
  reel: 1       # 8 saniyelik dikey video (Veo ile; daha pahalı, daha çok etkileşim)

hashtags:
  always: ["#karmaskesi", "#balaclava", "#kayak"]
  count: 12

# Gönderiye Instagram'ın resmi "Yapay zekâ bilgisi" etiketini ekler
ai_label: true
disclosure: "🎬 Görseller yapay zekâ ile oluşturulmuştur, maskelerimiz gerçektir."

# Ajanların asla üretmeyeceği içerikler
content_rules:
  - No real or famous people, no celebrities, no lookalikes
  - No logos or brand names of other companies (no LEGO, no ski brands); plain unbranded clothing and goggles
  - No readable text, captions or watermarks inside the image or video
  - No children or minors; all characters are adults
  - No cigarettes, alcohol, weapons or dangerous stunts, unless printed on the product itself
  - Nothing sexual or suggestive

review:
  max_attempts: 3      # Görsel beğenilmezse kaç kez yeniden üretilsin
  min_score: 7         # 10 üzerinden en düşük kabul puanı
  history_window: 20   # Son kaç paylaşım tekrar edilmesin
  video_attempts: 2    # Video beğenilmezse kaç kez yeniden üretilsin

photo_style: >-
  Photorealistic candid smartphone photo, bright natural winter daylight,
  crisp snow, true-to-life textures, authentic social media look, not an advertisement

video_style: >-
  Handheld smartphone footage, natural motion, realistic physics, bright winter daylight,
  ambient wind and laughter sounds, no music, no text on screen
